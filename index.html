<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lắp Cùng Tớ 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #111111;
    --white: #FFFFFF;
    --paper: #F1D02A;
    --grey: #6E6E6E;
    --line: #E4E4E0;
    --shadow: 0 6px 16px rgba(17,17,17,0.10);
    --radius: 16px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background: var(--paper);
    color: var(--black);
    font-family: 'Quicksand', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 0 0 60px;
    position:relative;
    overflow-x:hidden;
  }

  #bg-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .page{
    width:100%;
    max-width: 480px;
    min-height:100vh;
    background: transparent;
    position:relative;
    z-index:1;
  }

  /* ---- Avatar ---- */
  .avatar-wrap{
    display:flex;
    justify-content:center;
    padding-top: 44px;
    position:relative;
    z-index:2;
  }

  .avatar{
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: var(--white);
    border: 6px solid var(--paper);
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  .avatar:hover{
    transform: scale(1.03);
  }

  .avatar:active{
    transform: scale(0.97);
  }

  .logo-layer{
    position:absolute;
    width: 92%;
    height: 92%;
    top: 4%;
    left: 4%;
    object-fit:contain;
    pointer-events:none;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    will-change:transform, opacity, filter;
  }

  /* Base circle */
  .logo-base{
    animation: windBase 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  /* 4 parts bay từ 4 phía hợp thể mượt mà, tốc độ vừa phải, chuyển động liên tục */
  .logo-puzzle{
    animation: windFromTop 1.8s cubic-bezier(0.25, 1, 0.5, 1) 0.05s both;
  }

  .logo-assembling{
    animation: windFromLeft 1.85s cubic-bezier(0.25, 1, 0.5, 1) 0.12s both;
  }

  .logo-badge{
    animation: windFromRight 1.85s cubic-bezier(0.25, 1, 0.5, 1) 0.18s both;
  }

  .logo-subtitle{
    animation: windFromBottom 1.8s cubic-bezier(0.25, 1, 0.5, 1) 0.25s both;
  }

  /* Hiệu ứng chấn động nhẹ khi vừa hợp thể xong */
  .avatar.assembled{
    animation: mergePulse 0.5s cubic-bezier(0.25, 1, 0.5, 1) 2.05s both;
  }

  @keyframes windBase {
    0% {
      opacity: 0;
      transform: scale(0.75);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* 1. Icon mảnh ghép: từ trên lượn gió bay xuống liên tục, mượt mà */
  @keyframes windFromTop {
    0% {
      opacity: 0;
      transform: translate(-25px, -150px) rotate(-14deg) scale(0.65);
      filter: blur(4px);
    }
    25% {
      opacity: 0.85;
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg) scale(1);
      filter: blur(0);
    }
  }

  /* 2. Chữ Assembling: từ bên trái lượn gió bay vào liên tục, mượt mà */
  @keyframes windFromLeft {
    0% {
      opacity: 0;
      transform: translate(-180px, -20px) rotate(12deg) scale(0.65);
      filter: blur(4px);
    }
    25% {
      opacity: 0.85;
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg) scale(1);
      filter: blur(0);
    }
  }

  /* 3. Badge with me hi: từ bên phải lượn gió bay vào liên tục, mượt mà */
  @keyframes windFromRight {
    0% {
      opacity: 0;
      transform: translate(180px, 20px) rotate(-12deg) scale(0.65);
      filter: blur(4px);
    }
    25% {
      opacity: 0.85;
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg) scale(1);
      filter: blur(0);
    }
  }

  /* 4. Dòng chữ shop đồ chơi: từ dưới lượn gió bay lên liên tục, mượt mà */
  @keyframes windFromBottom {
    0% {
      opacity: 0;
      transform: translate(25px, 140px) rotate(10deg) scale(0.65);
      filter: blur(4px);
    }
    25% {
      opacity: 0.85;
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg) scale(1);
      filter: blur(0);
    }
  }

  @keyframes mergePulse {
    0% {
      transform: scale(1);
      box-shadow: var(--shadow);
    }
    50% {
      transform: scale(1.04);
      box-shadow: 0 10px 28px rgba(17,17,17,0.18), 0 0 20px rgba(255,255,255,0.7);
    }
    100% {
      transform: scale(1);
      box-shadow: var(--shadow);
    }
  }
  /* ---- Identity ---- */
  .identity{
    text-align:center;
    padding: 18px 32px 6px;
  }

  .brand-name{
    font-family:'Baloo 2', sans-serif;
    font-size: 30px;
    font-weight:800;
    color: var(--black);
    letter-spacing: 0.3px;
  }

  .tagline{
    margin-top:8px;
    font-size:15px;
    color: #262405;
    font-weight:600;
  }

  /* ---- Links ---- */
  .links{
    display:flex;
    flex-direction:column;
    gap:18px;
    padding: 28px 22px 8px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:16px;
    background: var(--white);
    border: none;
    border-radius: 20px;
    padding: 16px 20px;
    text-decoration:none;
    color: var(--black);
    box-shadow: 0 10px 24px rgba(17,17,17,0.09);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-btn:active{
    transform: scale(0.98);
  }

  @media (hover:hover){
    .link-btn:hover{
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(17,17,17,0.14);
    }
  }

  .link-icon{
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size: 20px;
    color:#fff;
  }

  .icon-shopee, .icon-zalo{ background: var(--white); }
  .icon-web{ background:#111111; }

  .link-icon img{
    width: 30px;
    height: 30px;
    object-fit: contain;
    border-radius: 6px;
  }

  .link-label{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:700;
  }

  .link-text{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .link-sublabel{
    font-size:12.5px;
    font-weight:600;
    color: var(--grey);
  }

  /* ---- Footer ---- */
  .handle{
    text-align:center;
    margin-top: 22px;
    font-size:14px;
    color: #1a1a1a;
    font-weight:700;
  }

  .footer-note{
    text-align:center;
    margin-top: 40px;
    font-size:12px;
    color: #BFBFBA;
  }
</style>
</head>

<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H;
  var particles = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DOT_COLOR = 'rgba(17,17,17,0.30)';
  var LINE_COLOR = '17,17,17';
  var LINK_DIST = 140;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var count = Math.min(150, Math.round((W * H) / 7000));
    particles = [];
    for (var i = 0; i < count; i++){
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 1.6,
        vy: (Math.random() - 0.5) * 1.6,
        r: Math.random() * 1.6 + 1.1
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = DOT_COLOR;
      ctx.fill();
    }

    for (var a = 0; a < particles.length; a++){
      for (var b = a + 1; b < particles.length; b++){
        var dx = particles[a].x - particles[b].x;
        var dy = particles[a].y - particles[b].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST){
          var opacity = (1 - dist / LINK_DIST) * 0.20;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.strokeStyle = 'rgba(' + LINE_COLOR + ',' + opacity + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', resize);
  resize();
  step();
})();
</script>


<script>
// Click avatar to replay wind assemble animation
(function(){
  var avatar = document.getElementById('avatar');
  if (!avatar) return;
  avatar.addEventListener('click', function(){
    avatar.classList.remove('assembled');
    var layers = avatar.querySelectorAll('.logo-layer');
    layers.forEach(function(el){
      el.style.animation = 'none';
      el.offsetHeight; /* trigger reflow */
      el.style.animation = '';
    });
    setTimeout(function(){
      avatar.classList.add('assembled');
    }, 10);
  });
})();
</script>
